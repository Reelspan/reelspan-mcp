name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Versions agree
        run: |
          v=$(node -p "require('./package.json').version")
          test "$(node -p "require('./server.json').version")" = "$v"
          test "$(node -p "require('./server.json').packages[0].version")" = "$v"
          grep -q "VERSION = '$v'" src/proxy.ts
